          <p class="process__text">No. 58 began as a different painting: a red ground covered with parchment paper and worked over in yellow. That surface was painted out completely in black. The profile was then laid in with white spray paint, and inside the head an opening was left on the buried layer. The earlier painting survives only as this fragment, visible through the new one. Since No. 56 this is the method of the series: earlier works become the material of later ones.</p>
